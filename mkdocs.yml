site_name: Research and Desire Product Documentation
site_description: Quick-start guide and reference for Research and Desire products.
site_url: https://docs.researchanddesire.com
use_directory_urls: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/missing-images.js
  - javascripts/product-footer-navigation.js

theme:
  name: material
  font:
    text: Figtree
  features:
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.tabs.link
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - glightbox:
      draggable: false
  - mkdocs-breadcrumbs-plugin:
      delimiter: " / "
      exclude_paths:
        - "**"
      generate_home_index: false
      home_text: Home
      log_level: WARNING
      use_page_titles: true
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - meta
  - neoteroi.cards
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

