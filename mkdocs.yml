site_name: Simple Docs
site_description: Contributor-friendly MkDocs starter

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Writing Guide: writing-guide.md
  - Contributing: contributing.md
