name: Request RadApp User Guide Import

on:
  push:
    branches:
      - main
      - staging
    paths:
      - "content/**"
      - ".github/workflows/sync-docs-userguide-content.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to synchronize
        required: true
        default: staging
        type: choice
        options:
          - staging
          - main

permissions:
  contents: read

concurrency:
  group: request-rad-app-userguide-import-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: false

jobs:
  request-import:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[docs-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SYNC_BRANCH: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
    steps:
      - name: Create documentation sync token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: researchanddesire
          repositories: rad-app

      - name: Request matching RadApp import
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run import-docs-content.yml \
            --repo researchanddesire/rad-app \
            --ref "$SYNC_BRANCH" \
            --field site=userguide \
            --field branch="$SYNC_BRANCH"
