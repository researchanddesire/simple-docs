# Documentation syncs run main to main only; staging receives docs from the hub.
name: Request RadApp User Guide Import

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - ".github/workflows/sync-docs-userguide-content.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: request-rad-app-userguide-import-main
  cancel-in-progress: false

jobs:
  request-import:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[docs-sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create documentation sync token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: researchanddesire
          repositories: rad-app

      - name: Request RadApp main import
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run import-docs-content.yml \
            --repo researchanddesire/rad-app \
            --ref main \
            --field site=userguide
